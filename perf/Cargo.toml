[package]
name = "passkey-auth-perf"
version = "0.0.0"
edition = "2024"
publish = false

[features]
aws-lc = ["passkey-auth/aws-lc"]

[dependencies]
passkey-auth = { path = ".." }
base64 = "0.22"
ciborium = "0.2"
ed25519-dalek = "3"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"
serde_json = "1"

[[bin]]
name = "ceremony-bench"
path = "../benches/ceremony.rs"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
