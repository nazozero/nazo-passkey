[package]
name = "nazo-passkey-perf"
version = "0.0.0"
edition = "2024"
publish = false

[features]
aws-lc = ["nazo-passkey/aws-lc"]

[dependencies]
nazo-passkey = { path = ".." }
base64 = "0.23.1"
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.1"
serde_json = "1.0.154"

[[bin]]
name = "ceremony-bench"
path = "../benches/ceremony.rs"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
