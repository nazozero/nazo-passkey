[package]
name = "passkey-backend-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aws-lc-rs = "=1.19.0"
ed25519-dalek = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
