[package]
name        = "passkey-auth"
version     = "0.2.0"
edition     = "2024"
rust-version = "1.100"
license     = "MIT OR Apache-2.0"
description = "WebAuthn relying party verifier with a pure-Rust default and optional native AWS-LC ES256."
repository  = "https://github.com/nazozero/passkey-auth-rs"
readme      = "README.md"
keywords    = ["webauthn", "passkey", "fido2", "authentication"]
categories  = ["authentication", "cryptography"]
authors     = ["bymoye <bymoye@users.noreply.github.com>", "Sriram <marirs@gmail.com>"]

[lib]
name = "passkey_auth"
path = "src/lib.rs"

[features]
default = []
# Native ES256 acceleration. Ed25519 retains dalek's strict acceptance policy;
# WebAssembly targets retain the portable RustCrypto ES256 implementation.
aws-lc = ["dep:aws-lc-rs"]

[dependencies]
# Portable RustCrypto dependencies; the optional native AWS-LC dependency is
# declared separately under its target condition below.
# No PEM handling is needed by the verifier. std supplies the synchronization
# used by the precomputed tables, preserving the baseline verification path.
p256          = { version = "0.14", default-features = false, features = ["ecdsa", "std", "precomputed-tables"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
sha2          = "0.11"
getrandom     = "0.4"
web-time      = "1.1"

# Base64URL for credential IDs, challenges, raw byte fields on the wire.
base64        = "0.22"

# JSON for clientDataJSON parsing.
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# Error type.
thiserror     = "2"

# URL parsing for origin checks.
url           = "2"

# X.509 parsing for the `packed` (with x5c) and `fido-u2f` attestation
# formats. Pure-Rust, RustCrypto family - no openssl. We extract the
# leaf cert's SubjectPublicKey and any AAGUID extension; we do NOT
# validate the chain (see README scope note).
x509-cert     = { version = "0.2", features = ["std"] }
const-oid     = "0.9"

[dev-dependencies]
proptest      = "1.12"
# Known-vector regression tests live under tests/.
hex           = "0.4"
# Integration tests synthesise authenticator output so they need the
# same crypto + encoding primitives the real authenticator would use.
base64        = "0.22"
ciborium      = "0.2"
# Independent point-encoding regressions use dalek's complete torsion subgroup.
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
# `oid` feature so sha2 implements AssociatedOid - needed when the
# x509-cert builder asks for the signature-algorithm identifier.
sha2          = { version = "0.11", features = ["oid"] }
rand          = "0.8"
# Re-enable p256's pkcs8 + pem features in dev builds so SigningKey
# implements SignatureAlgorithmIdentifier (required by x509-cert's
# builder). Cargo merges this with the regular dep's feature set; the
# library never imports anything PEM-related at runtime.
p256          = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
# The {axum,rocket}_server examples wire the crate into a real HTTP
# server so you can register / authenticate a real passkey in your
# browser.
axum          = "0.7"
tokio         = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http    = { version = "0.6", features = ["fs", "cors"] }
rocket        = { version = "0.5", default-features = false, features = ["json"] }

# x509-cert with the `builder` feature so attestation tests can mint
# a self-signed P-256 cert at runtime. Used by integration tests
# under tests/.
x509-cert-test = { package = "x509-cert", version = "0.3", features = ["builder", "std"] }

# Persistent storage for the axum_sqlite example. `bundled` ships
# the SQLite amalgamation so the example builds on machines that do
# not have sqlite installed system-wide (notably Windows CI).
rusqlite      = { version = "0.41", features = ["bundled"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# web-time already uses wasm-bindgen on this target; use Web Crypto for
# challenges and for the random backend selected by p256's std feature.
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Allow the consumer workspace to retain its existing compatible AWS-LC
# version. Reproducible validation is pinned by the committed lockfiles.
aws-lc-rs = { version = "1.18.2", optional = true }

[lints.cargo]
unused_dependencies = "warn"

[[example]]
name = "axum_server"
path = "examples/axum_server.rs"

[[example]]
name = "rocket_server"
path = "examples/rocket_server.rs"

[[example]]
name = "axum_passwordless"
path = "examples/axum_passwordless.rs"

[[example]]
name = "rocket_credential_manager"
path = "examples/rocket_credential_manager.rs"

[[example]]
name = "axum_sqlite"
path = "examples/axum_sqlite.rs"

[[bench]]
name = "ceremony"
harness = false
