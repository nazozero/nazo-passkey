name: CI

on:
  push:
    branches: [main, nazoauth/patched-rustcrypto]
  pull_request:
    branches: [main, nazoauth/patched-rustcrypto]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: test (${{ matrix.runner }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        backend: [rustcrypto, aws-lc]
        include:
          - backend: rustcrypto
            cargo_args: --no-default-features
          - backend: aws-lc
            cargo_args: --features aws-lc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: '1.100.0'
      - name: Install NASM for native AWS-LC
        if: runner.os == 'Windows' && matrix.backend == 'aws-lc'
        shell: pwsh
        run: |
          choco install nasm --version=3.2.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasmDir = Join-Path $env:ProgramFiles 'NASM'
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $nasmDir 'nasm.exe') -v
      - run: cargo test --locked --all-targets ${{ matrix.cargo_args }}
      - run: cargo test --locked --doc ${{ matrix.cargo_args }}

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: '1.100.0'
          target: wasm32-unknown-unknown, wasm32-wasip1
      - run: cargo check --locked --lib --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked --lib --target wasm32-unknown-unknown --all-features
      - run: cargo build --locked --release --manifest-path perf/Cargo.toml --target wasm32-wasip1 --all-features
      - run: node perf/wasi.mjs perf/target/wasm32-wasip1/release/ceremony-bench.wasm
        env:
          PERF_ITERATIONS: 100

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: '1.100.0'
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: nightly-2026-11-17
      - run: cargo +nightly-2026-11-17 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-11-17 fuzz run ceremonies -- -max_total_time=60 -rss_limit_mb=1024 -max_len=65540
      - run: cargo +nightly-2026-11-17 fuzz run ceremonies --features aws-lc -- -max_total_time=60 -rss_limit_mb=1024 -max_len=65540
