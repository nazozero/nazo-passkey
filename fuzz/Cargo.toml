[package]
name = "nazo-passkey-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
aws-lc = ["nazo-passkey/aws-lc"]

[dependencies]
libfuzzer-sys = "0.4.13"
nazo-passkey = { path = ".." }
base64 = "0.23.1"
serde_json = "1.0.154"
hex = "0.4.3"

[workspace]
members = ["."]

[[bin]]
name = "ceremonies"
path = "fuzz_targets/ceremonies.rs"
test = false
doc = false
bench = false
