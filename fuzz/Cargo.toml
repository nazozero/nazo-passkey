[package]
name = "passkey-auth-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
aws-lc = ["passkey-auth/aws-lc"]

[dependencies]
libfuzzer-sys = "0.4"
passkey-auth = { path = ".." }
base64 = "0.22"
serde_json = "1"
hex = "0.4"

[workspace]
members = ["."]

[[bin]]
name = "ceremonies"
path = "fuzz_targets/ceremonies.rs"
test = false
doc = false
bench = false
